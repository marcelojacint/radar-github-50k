name: Vídeos — renderizar

# Gera a narração (voz grátis do edge-tts), monta o vídeo de cada roteiro pendente em
# videos/roteiros/, publica o release "video-NNN" + a issue "🎬 Vídeo #N pronto" e envia ao
# YouTube agendado (com os secrets YT_CLIENT_ID, YT_CLIENT_SECRET e YT_REFRESH_TOKEN).
# A tarefa agendada do Claude dispara este workflow logo depois de escrever o roteiro;
# o agendamento abaixo só pega o que tiver ficado para trás.
on:
  workflow_dispatch:
    inputs:
      publicar_agora:
        description: "Publicar no YouTube assim que renderizar (sem esperar o horário do config)"
        type: boolean
        default: false
  schedule:
    - cron: "37 12 * * *"   # 09:37 em Brasília

permissions:
  contents: write
  issues: write

concurrency:
  group: video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04   # versão fixa: o ubuntu-latest muda sem aviso
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          # um repositório de terceiros fora do ar não pode travar a instalação
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core > /dev/null
          pip install -U pyyaml pillow edge-tts

      - name: Renderizar
        run: python scripts/video.py renderizar

      - name: Publicar (release + issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/video.py publicar

      - name: Postar no YouTube
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLICAR_AGORA: ${{ inputs.publicar_agora && 'true' || '' }}
        run: python scripts/video.py postar

      - name: Salvar status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/produzidos.json
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git commit -m "vídeos: $(TZ=America/Sao_Paulo date +%F) — renderizado(s)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
