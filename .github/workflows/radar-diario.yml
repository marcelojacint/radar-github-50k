name: Radar GitHub 50k (diário)

# A execução diária agora é feita pela tarefa agendada do Claude.
# Este workflow fica só para rodar manualmente (busca + catálogo, sem explicações).
# Para voltar a agendar aqui, descomente as duas linhas abaixo.
on:
  # schedule:
  #   - cron: "17 9 * * *"   # 06:17 em Brasília (o GitHub usa UTC)
  workflow_dispatch:
    inputs:
      max_explicacoes:
        description: "Quantas explicações gerar nesta execução (vazio = valor do config.yml)"
        required: false
        default: ""

permissions:
  contents: write   # commitar data/, CATALOGO.md, segmentos/ e relatorios/
  issues: write     # abrir a issue diária com as novidades

concurrency:
  group: radar-50k
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o radar
        id: radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MAX_EXPL: ${{ github.event.inputs.max_explicacoes }}
        run: |
          if [ -n "$MAX_EXPL" ]; then
            python scripts/radar.py --max-explicacoes "$MAX_EXPL"
          else
            python scripts/radar.py
          fi

      - name: Salvar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data CATALOGO.md segmentos relatorios
          if git diff --cached --quiet; then
            echo "Nada mudou hoje."
          else
            git commit -m "radar: $(TZ=America/Sao_Paulo date +%F) — ${{ steps.radar.outputs.novos }} novo(s)"
            git push
          fi

      - name: Abrir issue com as novidades
        if: steps.radar.outputs.abrir_issue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "$(cat .radar/titulo.txt)" --body-file .radar/issue.md
