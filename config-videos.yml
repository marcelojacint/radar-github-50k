# ─────────────────────────────────────────────────────────────
# Vídeos do canal IA para Pessoas — configuração
# Um vídeo de 3 a 5 minutos por repositório, do mais estrelado para o menos.
#
#   08:41  (seg, qua e sex) a tarefa agendada do Claude escreve o roteiro do próximo da fila
#          (videos/roteiros/NNN-nome.json) e dispara a renderização;
#   ~08:50 o GitHub Actions gera a narração, monta o vídeo, abre a issue "🎬 Vídeo #N pronto"
#          e envia ao YouTube agendado para o horário de postagem abaixo.
# ─────────────────────────────────────────────────────────────

canal:
  nome: "IA para Pessoas"       # aparece na abertura, no encerramento e na capa
  chamada_final: "Se inscreva para acompanhar o ranking inteiro, do mais estrelado para o menos."

postagem:
  ativa: true                   # posta sozinho quando os secrets YT_* existem no GitHub (veja videos/README.md)
  dias: [seg, qua, sex]         # dias de publicação (seg, ter, qua, qui, sex, sab, dom)
  horario: "18:00"              # o vídeo sobe de manhã agendado e fica público neste horário (Brasília)

fila: foco                      # foco = os repositórios de IA do radar | todos = os 20 mil+ estrelas

voz:
  nome: pt-BR-AntonioNeural     # outras: pt-BR-FranciscaNeural, pt-BR-ThalitaMultilingualNeural
  velocidade: "+4%"

roteiro:
  palavras_min: 430             # ~3 min de narração
  palavras_max: 780             # ~5 min de narração

cores:
  fundo: "#0A0F1F"
  fundo2: "#141C3A"
  painel: "#161F3D"
  borda: "#28335F"
  texto: "#F4F6FF"
  suave: "#9AA6CF"
  destaque: "#7C9CFF"
  destaque2: "#3DDC97"
  alerta: "#FFB454"
