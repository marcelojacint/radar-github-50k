# ─────────────────────────────────────────────────────────────
# Radar GitHub 50k — configuração
# Edite este arquivo direto no GitHub; a próxima execução já usa.
# ─────────────────────────────────────────────────────────────

busca:
  min_estrelas: 50000
  # Filtro extra na sintaxe de busca do GitHub (deixe "" para tudo).
  # Exemplos:
  #   "topic:agent-skills"   -> só repositórios de skills para agentes
  #   "language:csharp"      -> só C#
  #   "topic:llm"            -> só LLM
  filtro_extra: ""
  incluir_arquivados: false   # repositórios arquivados não servem para projeto novo

ia:
  # claude-agendado   -> [padrão] as explicações são escritas pela tarefa agendada do Claude,
  #                      que roda o script, explica os pendentes e envia as mudanças (sem chave, sem custo extra)
  # openai-compativel -> qualquer API no formato da OpenAI. Padrão: Groq, plano gratuito
  #                      (sem cartão; passou do limite, a API só recusa até o dia seguinte).
  #                      Secret: LLM_API_KEY
  # anthropic         -> Claude (pago por uso). Secret: ANTHROPIC_API_KEY
  # nenhum            -> só regras locais (sem explicação por segmento)
  # Sem o secret configurado, o radar roda normalmente e só pula a parte de IA.
  provedor: claude-agendado
  openai_compativel:
    url: https://api.groq.com/openai/v1/chat/completions
    modelo: openai/gpt-oss-120b
    parametros_extras:
      reasoning_effort: low      # menos "raciocínio" = menos tokens gastos da cota grátis
  modelo_anthropic: claude-haiku-5-5
  lote: 5                  # repositórios por chamada à IA
  pausa_segundos: 60       # espera entre chamadas (o plano grátis do Groq limita tokens por minuto)
  max_por_execucao: 100    # explicações novas por dia (a base inicial completa em ~6 dias)
  ler_readme: true         # usa o começo do README para explicar melhor

# Segmentos de negócio usados na análise de importância.
# Troque à vontade: a IA só usa nomes desta lista.
segmentos:
  - Saúde e clínicas
  - Indústria e ERP
  - Varejo e e-commerce
  - Finanças e fintech
  - Educação
  - Serviços e agendamento
  - Agronegócio
  - Setor público

relatorio:
  abrir_issue: quando_houver_novos   # sempre | quando_houver_novos | nunca
  top_crescimento: 10
